version: '3.8'

services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: spring-ai-pgvector
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: rag_db
      POSTGRES_USER: hasan
      POSTGRES_PASSWORD: postgre
    volumes:
      - pgvector_data:/var/lib/postgresql/data

volumes:
  pgvector_data: